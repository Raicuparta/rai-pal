[package]
name = "rai-pal-slint"
version.workspace = true
edition.workspace = true

[dependencies]
log.workspace = true
rai-pal-core.workspace = true
reqwest = { version = "0.13.3", features = ["blocking"] }
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
semver = "1.0.28"
base64 = "0.23.1"
minisign-verify = "0.3.0"
sha2 = "0.10"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
url = "2.5.7"
chrono = { version = "0.4.44", default-features = false, features = [
  "std",
  "clock",
] }
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
sys-locale = "0.3.2"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }
single-instance = "0.3.3"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"

[build-dependencies]
slint-build = "1.18.1"

[lints]
workspace = true