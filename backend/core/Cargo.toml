[package]
name = "rai-pal-core"
version.workspace = true
edition.workspace = true

[lib]

[dependencies]
log.workspace = true
rai-pal-proc-macros.workspace = true
serde_json.workspace = true
serde.workspace = true
fs-err.workspace = true
specta = { workspace = true, features = ["derive"] }
thiserror.workspace = true
rusqlite.workspace = true
strum.workspace = true

open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
dunce = "1.0"
base64 = "0.23.1"
byteorder = "1.5.0"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
directories = "6.0.0"
tokio = { version = "1.53.3", features = ["process", "fs"] }
globwalk = "0.9.1"
lazy-regex = "3.6.2"
memmap2 = "0.9.5"
pelite = { version = "0.10.0", features = ["std"], default-features = false }
reqwest = { version = "0.13.5", features = [
  "json",
  "stream",
  "gzip", # We have some large JSONs in the Rai Pal Database, so gzip is useful.
] }
serde_urlencoded = "0.7.1"
steamlocate = "2.1.1"
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v4"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
futures-util = "0.3"
memchr = "2.8.3"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winuser"] }
winreg = "0.56.0"

[lints]
workspace = true
