name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install slint-tr-extractor
        run: scripts/check-translations.sh --install-tool

      - name: Check translations
        run: scripts/check-translations.sh
