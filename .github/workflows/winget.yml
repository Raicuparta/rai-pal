name: Update WinGet Package

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release-tag:
        description: "The release tag to submit to WinGet"
        required: true

jobs:
  winget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Submit To WinGet
        env:
          GH_TOKEN: ${{ secrets.WINGET_GH_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release-tag }}
        run: bash scripts/update-winget.sh "$RELEASE_TAG"
