name: Create Releases

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Choose which platform to build"
        required: true
        type: choice
        default: "all"
        options:
          - all
          - ubuntu
          - windows
          - macos

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Get Version
        id: version
        run: bash scripts/get-version.sh

      - name: Generate Release Body
        id: body
        run: bash scripts/generate-release-body.sh ${{ steps.version.outputs.version }}

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          body_path: ${{ steps.body.outputs.body_path }}
          draft: true

  release-matrix:
    needs: create-release
    if: inputs.build_target != 'macos'
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.build_target == 'windows' && '[{"os-name":"windows"}]' ||
            inputs.build_target == 'ubuntu' && '[{"os-name":"linux"}]' ||
            '[{"os-name":"windows"},{"os-name":"linux"}]'
          ) }}

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    container:
      image: ghcr.io/raicuparta/rai-pal-builder:${{ matrix.os-name }}-latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Build (Linux)
        if: matrix.os-name == 'linux'
        run: bash scripts/build-slint-appimage.sh

      - name: Build (Windows)
        if: matrix.os-name == 'windows'
        run: bash scripts/build-slint-windows.sh

      - name: Collect Build Artifacts
        run: bash scripts/collect-build-artifacts.sh ${{ matrix.os-name }} ${{ needs.create-release.outputs.version }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: release-assets/*
          draft: true

  release-slint-macos:
    needs: create-release
    if: inputs.build_target == 'macos'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS app
        run: bash scripts/build-slint-macos.sh

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: crates/slint-app/dist/*.zip
          draft: true
