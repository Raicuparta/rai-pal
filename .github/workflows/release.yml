name: Create Releases

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build Windows"
        type: boolean
        default: true
      build_linux:
        description: "Build Linux"
        type: boolean
        default: true
      build_macos:
        description: "Build macOS"
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/check
        with:
          full: true

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate updater signing secrets
        if: inputs.build_windows || inputs.build_linux || inputs.build_macos
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          UPDATE_KEY_PASSWORD: ${{ secrets.UPDATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$UPDATE_PRIVATE_KEY" || -z "$UPDATE_KEY_PASSWORD" ]]; then
            echo "Missing UPDATE_PRIVATE_KEY or UPDATE_KEY_PASSWORD repository secret." >&2
            exit 1
          fi

      - name: Get Version
        id: version
        run: bash scripts/get-version.sh

      - name: Generate Release Body
        id: body
        run: bash scripts/generate-release-body.sh ${{ steps.version.outputs.version }}

      - name: Create Or Update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          body_path: ${{ steps.body.outputs.body_path }}
          draft: true

  build-windows:
    needs: create-release
    if: inputs.build_windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/raicuparta/rai-pal-builder:windows-latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Ensure NSIS
        run: |
          if ! command -v makensis >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends nsis
          fi

      - name: Build (Windows)
        run: bash scripts/build-windows.sh

      - name: Publish Artifacts
        uses: ./.github/actions/publish-artifacts
        with:
          platform: windows
          version: ${{ needs.create-release.outputs.version }}
          tag_name: ${{ needs.create-release.outputs.tag_name }}
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          UPDATE_KEY_PASSWORD: ${{ secrets.UPDATE_KEY_PASSWORD }}

  build-linux:
    needs: create-release
    if: inputs.build_linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/raicuparta/rai-pal-builder:linux-latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Build (Linux)
        run: bash scripts/build-appimage.sh

      - name: Publish Artifacts
        uses: ./.github/actions/publish-artifacts
        with:
          platform: linux
          version: ${{ needs.create-release.outputs.version }}
          tag_name: ${{ needs.create-release.outputs.tag_name }}
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          UPDATE_KEY_PASSWORD: ${{ secrets.UPDATE_KEY_PASSWORD }}

  build-macos:
    needs: create-release
    if: inputs.build_macos
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS app
        run: bash scripts/build-macos.sh

      - name: Publish Artifacts
        uses: ./.github/actions/publish-artifacts
        with:
          platform: macos
          version: ${{ needs.create-release.outputs.version }}
          tag_name: ${{ needs.create-release.outputs.tag_name }}
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          UPDATE_KEY_PASSWORD: ${{ secrets.UPDATE_KEY_PASSWORD }}

  finalize-release:
    needs: [check, create-release, build-windows, build-linux, build-macos]
    if: ${{ always() && needs.check.result == 'success' && needs.create-release.result == 'success' && needs.build-windows.result != 'failure' && needs.build-linux.result != 'failure' && needs.build-macos.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Updater Partials
        if: inputs.build_windows || inputs.build_linux || inputs.build_macos
        uses: actions/download-artifact@v4
        with:
          path: updater-partials
          pattern: updater-partial-*

      - name: Download Existing Updater JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p existing-updater
          gh release download "${{ needs.create-release.outputs.tag_name }}" \
            --pattern latest.json --dir existing-updater --clobber ||
            echo "No existing latest.json on the release."

      - name: Merge Updater JSON
        id: merge
        run: bash scripts/merge-updater-json.sh updater-partials existing-updater/latest.json

      - name: Upload Updater JSON
        if: steps.merge.outputs.has_latest == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: latest.json
          draft: true
