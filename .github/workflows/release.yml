name: "release"

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Choose which platform to build"
        required: true
        type: choice
        default: "all"
        options:
          - all
          - ubuntu
          - windows
  push:
    branches: [main]

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Get Version
        id: version
        run: node scripts/get-version.js

      - name: Generate Release Body
        id: body
        run: node scripts/generate-release-body.js ${{ steps.version.outputs.version }}

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          body_path: ${{ steps.body.outputs.body_path }}
          draft: true

  release-matrix:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.build_target == 'windows' && '[{"os-name":"windows"}]' ||
            inputs.build_target == 'ubuntu' && '[{"os-name":"linux"}]' ||
            '[{"os-name":"windows"},{"os-name":"linux"}]'
          ) }}

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    container:
      image: ghcr.io/raicuparta/rai-pal-builder:${{ matrix.os-name }}-latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Install frontend dependencies
        run: npm ci

      - name: Build (Linux)
        if: matrix.os-name == 'linux'
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}

      - name: Build (Windows)
        if: matrix.os-name == 'windows'
        run: npm run build-windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          ANALYTICS_API_KEY: ${{ secrets.ANALYTICS_API_KEY }}

      - name: Collect Build Artifacts
        id: collect
        run: node scripts/collect-build-artifacts.js ${{ matrix.os-name }} ${{ github.repository_owner }} ${{ github.event.repository.name }} ${{ needs.create-release.outputs.version }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: release-assets/*
          draft: true

      - name: Upload Updater Partial
        uses: actions/upload-artifact@v7
        with:
          name: updater-partial-${{ matrix.os-name }}
          path: updater-partial-*.json

  finalize-release:
    needs: [create-release, release-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Download Updater Partials
        uses: actions/download-artifact@v4
        with:
          path: updater-partials
          pattern: updater-partial-*

      - name: Merge Updater JSON
        id: merge
        run: node scripts/merge-updater-json.js updater-partials

      - name: Upload Updater JSON
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: latest.json
          draft: true
