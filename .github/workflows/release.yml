name: Create Releases

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Choose which platform to build"
        required: true
        type: choice
        default: "all"
        options:
          - all
          - ubuntu
          - windows
          - macos

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate updater signing secrets
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          UPDATE_KEY_PASSWORD: ${{ secrets.UPDATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$UPDATE_PRIVATE_KEY" || -z "$UPDATE_KEY_PASSWORD" ]]; then
            echo "Missing UPDATE_PRIVATE_KEY or UPDATE_KEY_PASSWORD repository secret." >&2
            exit 1
          fi

      - name: Get Version
        id: version
        run: bash scripts/get-version.sh

      - name: Generate Release Body
        id: body
        run: bash scripts/generate-release-body.sh ${{ steps.version.outputs.version }}

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          body_path: ${{ steps.body.outputs.body_path }}
          draft: true

  build-linux-windows:
    needs: create-release
    if: inputs.build_target != 'macos'
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.build_target == 'windows' && '[{"os-name":"windows"}]' ||
            inputs.build_target == 'ubuntu' && '[{"os-name":"linux"}]' ||
            '[{"os-name":"windows"},{"os-name":"linux"}]'
          ) }}

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    container:
      image: ghcr.io/raicuparta/rai-pal-builder:${{ matrix.os-name }}-latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Ensure NSIS
        if: matrix.os-name == 'windows'
        run: |
          if ! command -v makensis >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends nsis
          fi

      - name: Build (Linux)
        if: matrix.os-name == 'linux'
        run: bash scripts/build-appimage.sh

      - name: Build (Windows)
        if: matrix.os-name == 'windows'
        run: bash scripts/build-windows.sh

      - name: Publish Artifacts
        uses: ./.github/actions/publish-artifacts
        with:
          platform: ${{ matrix.os-name }}
          version: ${{ needs.create-release.outputs.version }}
          tag_name: ${{ needs.create-release.outputs.tag_name }}
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          UPDATE_KEY_PASSWORD: ${{ secrets.UPDATE_KEY_PASSWORD }}

  build-macos:
    needs: create-release
    if: inputs.build_target == 'macos' || inputs.build_target == 'all'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS app
        run: bash scripts/build-macos.sh

      - name: Publish Artifacts
        uses: ./.github/actions/publish-artifacts
        with:
          platform: macos
          version: ${{ needs.create-release.outputs.version }}
          tag_name: ${{ needs.create-release.outputs.tag_name }}
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          UPDATE_KEY_PASSWORD: ${{ secrets.UPDATE_KEY_PASSWORD }}

  finalize-release:
    needs: [create-release, build-linux-windows, build-macos]
    if: ${{ always() && needs.create-release.result == 'success' && needs.build-linux-windows.result != 'failure' && needs.build-macos.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Updater Partials
        uses: actions/download-artifact@v4
        with:
          path: updater-partials
          pattern: updater-partial-*

      - name: Merge Updater JSON
        run: bash scripts/merge-updater-json.sh updater-partials

      - name: Upload Updater JSON
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: latest.json
          draft: true
